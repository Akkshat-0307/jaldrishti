app = "jaldrishti-api"
primary_region = "sin"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  DEMO_MODE = "1"
  DATA_DIR = "/app/data"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"
